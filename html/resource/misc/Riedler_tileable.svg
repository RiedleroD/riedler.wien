<svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
	<style>
@property --animclock {
	syntax: "&lt;number&gt;";
	inherits: false;
	initial-value: 0;
}
@property --ranimclock {
	syntax: "&lt;number&gt;";
	inherits: false;
	initial-value: 0;
}
@keyframes animclock {
	from {--animclock: 0; --ranimclock: 1;}
	to {--animclock: 1; --ranimclock: 0;}
}
@keyframes r {
	to {d: path("M-19.3795 938.967 60.0015 1021.24 295.257 1064.53 184.124 1331.54 471.34 1409.48V1604.33H-7.8335ZM1473.4 1441 1155.69 1324.17 1259.29 1076.31 1019.22 1013.65 896.774 905.455 669.997 845.333 778 593 530.478 535.679 424.561 422.582 182.019 366.154 296.855 108.762-26.8635 5.806-481 21.703-181.266 101.746-302.76 350.453-48.831 434.272 63.011 541.57 295.039 593.13 183.859 846.11 501.286 952.45ZM1441 479 1377.75 418.303 1141.03 366.68 1258.13 109.821 947.13 14.128 5.98-481 53.148-409.961 309.002-374.229 180.361-95.504 437.668-46.514 540.17 64.749 776.64 114.271 667.69 375.503 975.96 464.644Z");}
}
@media not (prefers-reduced-motion) {
	#r, :root {
		animation: 5s infinite cubic-bezier(.52,.21,.44,.76);
	}
	#r {
		animation-name: r;
	}
	:root {
		animation-name: animclock;
	}
}
:root {
	--animclock: 0;
	--ranimclock: 1;
	animation-name: animclock;
	--0-480p: calc(var(--animclock) * 480px);
	--0--480p: calc(var(--animclock) * -480px);
	--480-0p: calc(var(--ranimclock) * 480px);
	---480-0p: calc(var(--ranimclock) * -480px);
	--480-960p: calc(480px + var(--animclock) * 480px);
	--960-480p: calc(480px + var(--ranimclock) * 480px);
}
#a {x: var(--0-480p); y: var(--0-480p)}
#b {x: var(--480-0p); y: var(--0--480p)}
#c {x: var(--0--480p); y: var(--480-0p)}
#d {x: var(--480-960p); y: var(--480-960p)}
#e {x: var(---480-0p); y: var(---480-0p)}
#f {x: var(--480-0p); y: var(--960-480p)}
#g {x: var(--960-480p); y: var(--480-0p)}
#x {x: var(---480-0p); y: var(--480-960p)}
#y {x: var(--480-960p); y: var(---480-0p)}
#r {animation-name: r}
